<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>创业摇篮 · Startup Cradle</title>
  <meta name="description" content="策展式早期潜力公司目录。公开信号可核验，宁缺毋滥。非投资建议。" />
  <link rel="stylesheet" href="./assets/styles.css" />
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="eyebrow">Startup Cradle · 创业摇篮</div>
      <h1>把「有潜力」做成可逛的展览</h1>
      <p class="lead">
        创业坟场的反面：只收录仍早期、已有可访问产物、且至少有一条可点开核验的公开热度信号的公司。
        单人也能逛；条目硬、来源可查、版式干净。
      </p>
      <div class="stats">
        <div class="stat">在册 <strong id="count-total">0</strong></div>
        <div class="stat">当前可见 <strong id="count-shown">0</strong></div>
        <div class="stat">更新 <strong id="updated-at">—</strong></div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <div class="filters">
        <input id="q" type="search" placeholder="搜索名称 / 一句话 / 赛道" aria-label="搜索" />
        <select id="region" aria-label="地区">
          <option value="">全部地区</option>
        </select>
        <select id="sector" aria-label="赛道">
          <option value="">全部赛道</option>
        </select>
        <select id="status" aria-label="状态">
          <option value="">全部状态</option>
          <option value="watching">观察中</option>
          <option value="graduated">已毕业</option>
          <option value="archived">归档</option>
        </select>
      </div>
    </div>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <footer class="wrap disclaimer">
    <h2>免责声明</h2>
    <p id="disclaimer-text"></p>
    <p class="foot-meta">数据：<code>data/companies.json</code> · 门禁：<code>python3 scripts/validate.py [--check-links]</code></p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="./assets/app.js"></script>
</body>
</html>
